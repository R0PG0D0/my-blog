services:
  blog:
    image: node:22-alpine
    container_name: ropgod-blog
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      TZ: Asia/Shanghai
    volumes:
      - /opt/ropgod-blog/current:/app:ro
    networks:
      - web

  artalk:
    image: artalk/artalk-go:2.9.1
    container_name: ropgod-artalk
    restart: unless-stopped
    environment:
      ATK_LOCALE: zh-CN
      ATK_SITE_DEFAULT: ropgod.site
      ATK_SITE_URL: https://www.ropgod.site
      TZ: Asia/Shanghai
    volumes:
      - /opt/ropgod-blog/artalk-data:/data
    command: ["server", "--host", "0.0.0.0", "--port", "23366"]
    networks:
      - web

